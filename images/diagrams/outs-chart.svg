<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&amp;display=swap');
      .title { font-family: 'Noto Sans KR', sans-serif; font-size: 32px; font-weight: 700; fill: #ffffff; }
      .subtitle { font-family: 'Noto Sans KR', sans-serif; font-size: 20px; font-weight: 600; fill: #ffffff; }
      .label { font-family: 'Noto Sans KR', sans-serif; font-size: 16px; font-weight: 400; fill: #cccccc; }
      .table-header { font-family: 'Noto Sans KR', sans-serif; font-size: 16px; font-weight: 700; fill: #ffffff; }
      .table-cell { font-family: 'Arial', sans-serif; font-size: 15px; font-weight: 400; fill: #e0e0e0; }
    </style>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="500" y="45" class="title" text-anchor="middle">아웃츠 (Outs) 카운팅 차트</text>

  <!-- Rule of 4 and 2 -->
  <g transform="translate(50, 80)">
    <rect width="900" height="120" rx="10" fill="#2ecc71" opacity="0.3" filter="url(#shadow)"/>

    <text x="450" y="35" class="subtitle" text-anchor="middle">Rule of 4 and 2 (간편 계산법)</text>

    <g transform="translate(100, 60)">
      <rect width="300" height="50" rx="5" fill="#27ae60" opacity="0.6"/>
      <text x="150" y="32" class="label" text-anchor="middle" font-weight="600">플랍 → 리버: 아웃츠 × 4</text>
    </g>

    <g transform="translate(500, 60)">
      <rect width="300" height="50" rx="5" fill="#27ae60" opacity="0.6"/>
      <text x="150" y="32" class="label" text-anchor="middle" font-weight="600">턴 → 리버: 아웃츠 × 2</text>
    </g>
  </g>

  <!-- Outs Table -->
  <g transform="translate(50, 230)">
    <rect width="900" height="420" rx="10" fill="#0f4c75" opacity="0.4" filter="url(#shadow)"/>

    <!-- Table Header -->
    <rect x="0" y="0" width="900" height="50" rx="10" fill="#3498db" opacity="0.6"/>
    <text x="100" y="32" class="table-header" text-anchor="middle">아웃츠</text>
    <text x="300" y="32" class="table-header" text-anchor="middle">승률 (플랍→리버)</text>
    <text x="550" y="32" class="table-header" text-anchor="middle">승률 (턴→리버)</text>
    <text x="780" y="32" class="table-header" text-anchor="middle">예시 상황</text>

    <!-- Table Rows -->
    <!-- Row 1 -->
    <g transform="translate(0, 65)">
      <rect x="0" y="0" width="900" height="45" fill="#ffffff" opacity="0.05"/>
      <text x="100" y="28" class="table-cell" text-anchor="middle" font-weight="700" fill="#2ecc71">15개</text>
      <text x="300" y="28" class="table-cell" text-anchor="middle">~54%</text>
      <text x="550" y="28" class="table-cell" text-anchor="middle">~33%</text>
      <text x="780" y="28" class="table-cell" text-anchor="middle" font-size="13">플러시+스트레이트 드로우</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 110)">
      <text x="100" y="28" class="table-cell" text-anchor="middle" font-weight="700" fill="#3498db">12개</text>
      <text x="300" y="28" class="table-cell" text-anchor="middle">~45%</text>
      <text x="550" y="28" class="table-cell" text-anchor="middle">~26%</text>
      <text x="780" y="28" class="table-cell" text-anchor="middle" font-size="13">플러시 드로우 + 오버카드</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(0, 155)">
      <rect x="0" y="0" width="900" height="45" fill="#ffffff" opacity="0.05"/>
      <text x="100" y="28" class="table-cell" text-anchor="middle" font-weight="700" fill="#3498db">9개</text>
      <text x="300" y="28" class="table-cell" text-anchor="middle">~35%</text>
      <text x="550" y="28" class="table-cell" text-anchor="middle">~20%</text>
      <text x="780" y="28" class="table-cell" text-anchor="middle" font-size="13">플러시 드로우</text>
    </g>

    <!-- Row 4 -->
    <g transform="translate(0, 200)">
      <text x="100" y="28" class="table-cell" text-anchor="middle" font-weight="700" fill="#f39c12">8개</text>
      <text x="300" y="28" class="table-cell" text-anchor="middle">~31%</text>
      <text x="550" y="28" class="table-cell" text-anchor="middle">~17%</text>
      <text x="780" y="28" class="table-cell" text-anchor="middle" font-size="13">양방향 스트레이트 드로우</text>
    </g>

    <!-- Row 5 -->
    <g transform="translate(0, 245)">
      <rect x="0" y="0" width="900" height="45" fill="#ffffff" opacity="0.05"/>
      <text x="100" y="28" class="table-cell" text-anchor="middle" font-weight="700" fill="#f39c12">6개</text>
      <text x="300" y="28" class="table-cell" text-anchor="middle">~24%</text>
      <text x="550" y="28" class="table-cell" text-anchor="middle">~13%</text>
      <text x="780" y="28" class="table-cell" text-anchor="middle" font-size="13">투페어 → 풀하우스</text>
    </g>

    <!-- Row 6 -->
    <g transform="translate(0, 290)">
      <text x="100" y="28" class="table-cell" text-anchor="middle" font-weight="700" fill="#e67e22">4개</text>
      <text x="300" y="28" class="table-cell" text-anchor="middle">~17%</text>
      <text x="550" y="28" class="table-cell" text-anchor="middle">~9%</text>
      <text x="780" y="28" class="table-cell" text-anchor="middle" font-size="13">거츠샷 스트레이트 드로우</text>
    </g>

    <!-- Row 7 -->
    <g transform="translate(0, 335)">
      <rect x="0" y="0" width="900" height="45" fill="#ffffff" opacity="0.05"/>
      <text x="100" y="28" class="table-cell" text-anchor="middle" font-weight="700" fill="#e74c3c">2개</text>
      <text x="300" y="28" class="table-cell" text-anchor="middle">~8%</text>
      <text x="550" y="28" class="table-cell" text-anchor="middle">~4%</text>
      <text x="780" y="28" class="table-cell" text-anchor="middle" font-size="13">원페어 → 트리플</text>
    </g>
  </g>

  <!-- Bottom note -->
  <text x="500" y="680" class="label" text-anchor="middle" fill="#95a5a6">
    아웃츠 = 나를 이기게 만들 수 있는 카드의 개수
  </text>
</svg>