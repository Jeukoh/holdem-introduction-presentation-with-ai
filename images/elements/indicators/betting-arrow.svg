<svg width="120" height="40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#f39c12"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Curved arrow -->
  <path d="M 10 20 Q 60 10, 110 20" fill="none" stroke="#f39c12" stroke-width="4" marker-end="url(#arrowhead)" filter="url(#glow)"/>

  <!-- Bet label -->
  <rect x="45" y="5" width="30" height="16" rx="8" fill="#f39c12"/>
  <text x="60" y="16" font-family="Arial" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">BET</text>
</svg>