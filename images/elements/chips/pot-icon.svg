<svg width="150" height="100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
    <radialGradient id="chipGrad" cx="50%" cy="30%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.2" />
    </radialGradient>
  </defs>

  <!-- Messy pile of chips -->
  <!-- Bottom layer -->
  <ellipse cx="75" cy="75" rx="50" ry="15" fill="#e74c3c" filter="url(#shadow)"/>
  <ellipse cx="75" cy="75" rx="50" ry="15" fill="url(#chipGrad)" opacity="0.3"/>

  <!-- Middle chips -->
  <ellipse cx="55" cy="65" rx="35" ry="10" fill="#3498db"/>
  <ellipse cx="55" cy="65" rx="35" ry="10" fill="url(#chipGrad)" opacity="0.3"/>
  <ellipse cx="55" cy="65" rx="25" ry="7" fill="none" stroke="#ffffff" stroke-width="1.5"/>

  <ellipse cx="95" cy="60" rx="30" ry="9" fill="#2ecc71"/>
  <ellipse cx="95" cy="60" rx="30" ry="9" fill="url(#chipGrad)" opacity="0.3"/>
  <ellipse cx="95" cy="60" rx="20" ry="6" fill="none" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Top chips -->
  <ellipse cx="75" cy="50" rx="32" ry="10" fill="#9b59b6"/>
  <ellipse cx="75" cy="50" rx="32" ry="10" fill="url(#chipGrad)" opacity="0.3"/>
  <ellipse cx="75" cy="50" rx="22" ry="7" fill="none" stroke="#ffffff" stroke-width="1.5"/>

  <ellipse cx="65" cy="40" rx="28" ry="8" fill="#f39c12"/>
  <ellipse cx="65" cy="40" rx="28" ry="8" fill="url(#chipGrad)" opacity="0.3"/>
  <ellipse cx="65" cy="40" rx="18" ry="5" fill="none" stroke="#ffffff" stroke-width="1.5"/>

  <!-- POT label (optional, can be removed) -->
  <text x="75" y="15" font-family="Arial" font-size="14" font-weight="bold" fill="#f39c12" text-anchor="middle">POT</text>
</svg>