<svg width="100" height="140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
    <radialGradient id="chipGrad" cx="50%" cy="30%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.2" />
    </radialGradient>
  </defs>

  <!-- Stack of 5 chips with different colors -->
  <!-- Red chip ($5) -->
  <g transform="translate(0, 100)">
    <ellipse cx="50" cy="10" rx="40" ry="12" fill="#e74c3c" filter="url(#shadow)"/>
    <ellipse cx="50" cy="10" rx="40" ry="12" fill="url(#chipGrad)" opacity="0.3"/>
    <ellipse cx="50" cy="10" rx="30" ry="9" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Blue chip ($10) -->
  <g transform="translate(0, 75)">
    <ellipse cx="50" cy="10" rx="40" ry="12" fill="#3498db" filter="url(#shadow)"/>
    <ellipse cx="50" cy="10" rx="40" ry="12" fill="url(#chipGrad)" opacity="0.3"/>
    <ellipse cx="50" cy="10" rx="30" ry="9" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Green chip ($25) -->
  <g transform="translate(0, 50)">
    <ellipse cx="50" cy="10" rx="40" ry="12" fill="#2ecc71" filter="url(#shadow)"/>
    <ellipse cx="50" cy="10" rx="40" ry="12" fill="url(#chipGrad)" opacity="0.3"/>
    <ellipse cx="50" cy="10" rx="30" ry="9" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Black chip ($100) -->
  <g transform="translate(0, 25)">
    <ellipse cx="50" cy="10" rx="40" ry="12" fill="#2c3e50" filter="url(#shadow)"/>
    <ellipse cx="50" cy="10" rx="40" ry="12" fill="url(#chipGrad)" opacity="0.3"/>
    <ellipse cx="50" cy="10" rx="30" ry="9" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Purple chip ($500) -->
  <g transform="translate(0, 0)">
    <ellipse cx="50" cy="10" rx="40" ry="12" fill="#9b59b6" filter="url(#shadow)"/>
    <ellipse cx="50" cy="10" rx="40" ry="12" fill="url(#chipGrad)" opacity="0.3"/>
    <ellipse cx="50" cy="10" rx="30" ry="9" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>