<svg width="520" height="520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Grid container background -->
  <rect width="520" height="520" fill="#ecf0f1" filter="url(#shadow)"/>

  <!-- Draw 13x13 grid -->
  <g id="grid">
    <!-- Vertical lines -->
    <line x1="0" y1="0" x2="0" y2="520" stroke="#95a5a6" stroke-width="1"/>
    <line x1="40" y1="0" x2="40" y2="520" stroke="#95a5a6" stroke-width="1"/>
    <line x1="80" y1="0" x2="80" y2="520" stroke="#95a5a6" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="520" stroke="#95a5a6" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="520" stroke="#95a5a6" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="520" stroke="#95a5a6" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="520" stroke="#95a5a6" stroke-width="1"/>
    <line x1="280" y1="0" x2="280" y2="520" stroke="#95a5a6" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="520" stroke="#95a5a6" stroke-width="1"/>
    <line x1="360" y1="0" x2="360" y2="520" stroke="#95a5a6" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="520" stroke="#95a5a6" stroke-width="1"/>
    <line x1="440" y1="0" x2="440" y2="520" stroke="#95a5a6" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="520" stroke="#95a5a6" stroke-width="1"/>
    <line x1="520" y1="0" x2="520" y2="520" stroke="#95a5a6" stroke-width="1"/>

    <!-- Horizontal lines -->
    <line x1="0" y1="0" x2="520" y2="0" stroke="#95a5a6" stroke-width="1"/>
    <line x1="0" y1="40" x2="520" y2="40" stroke="#95a5a6" stroke-width="1"/>
    <line x1="0" y1="80" x2="520" y2="80" stroke="#95a5a6" stroke-width="1"/>
    <line x1="0" y1="120" x2="520" y2="120" stroke="#95a5a6" stroke-width="1"/>
    <line x1="0" y1="160" x2="520" y2="160" stroke="#95a5a6" stroke-width="1"/>
    <line x1="0" y1="200" x2="520" y2="200" stroke="#95a5a6" stroke-width="1"/>
    <line x1="0" y1="240" x2="520" y2="240" stroke="#95a5a6" stroke-width="1"/>
    <line x1="0" y1="280" x2="520" y2="280" stroke="#95a5a6" stroke-width="1"/>
    <line x1="0" y1="320" x2="520" y2="320" stroke="#95a5a6" stroke-width="1"/>
    <line x1="0" y1="360" x2="520" y2="360" stroke="#95a5a6" stroke-width="1"/>
    <line x1="0" y1="400" x2="520" y2="400" stroke="#95a5a6" stroke-width="1"/>
    <line x1="0" y1="440" x2="520" y2="440" stroke="#95a5a6" stroke-width="1"/>
    <line x1="0" y1="480" x2="520" y2="480" stroke="#95a5a6" stroke-width="1"/>
    <line x1="0" y1="520" x2="520" y2="520" stroke="#95a5a6" stroke-width="1"/>
  </g>

  <!-- Empty cells can be filled with colors in HTML/CSS using overlays -->
  <!-- This is a template for creating custom hand range selections -->
</svg>
