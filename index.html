<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texas Hold'em 소개 - 불확실성 속 합리적 의사결정</title>

    <!-- Reveal.js CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.5.0/dist/reveal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.5.0/dist/theme/black.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/custom.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="reveal">
        <div class="slides" id="slides-container">
            <!-- Slides will be dynamically loaded here -->
        </div>
    </div>

    <!-- Reveal.js Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@4.5.0/dist/reveal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@4.5.0/plugin/notes/notes.js"></script>
    <script>
        // Dynamically load all act sections
        const acts = ['act1', 'act2', 'act3', 'act4', 'act5'];

        Promise.all(
            acts.map(act =>
                fetch(`sections/${act}.html`)
                    .then(response => {
                        if (!response.ok) {
                            console.warn(`Failed to load ${act}.html: ${response.status}`);
                            return '';
                        }
                        return response.text();
                    })
                    .catch(err => {
                        console.warn(`Error loading ${act}.html:`, err);
                        return '';
                    })
            )
        ).then(htmls => {
            // Insert all loaded HTML into slides container
            document.getElementById('slides-container').innerHTML = htmls.join('\n');

            // Initialize Reveal.js after content is loaded
            Reveal.initialize({
                hash: true,
                slideNumber: 'c/t',
                transition: 'slide',
                progress: true,
                center: true,
                controls: true,
                width: 1920,
                height: 1080,
                margin: 0.04,
                minScale: 0.5,
                maxScale: 1.5,
                plugins: [RevealNotes]
            });
        });
    </script>
</body>
</html>
