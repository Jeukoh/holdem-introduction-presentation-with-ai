<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texas Hold'em 입문</title>

    <!-- Reveal.js -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.5.0/dist/reveal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.5.0/dist/theme/black.css">

    <!-- Holdem Engine CSS -->
    <link rel="stylesheet" href="src/react-framer/dist/holdem-engine.css">

    <!-- Custom styles -->
    <link rel="stylesheet" href="css/presentation.css">

    <!-- Preload JSON bundle for faster card rendering -->
    <link rel="preload" href="assets/cards-bundle.json" as="fetch" crossorigin>

    <!-- React (for Holdem Engine) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body>
    <div class="reveal">
        <div class="slides">
            <!-- 동적 로딩 -->
        </div>
    </div>

    <div class="key-hint">
        <kbd>→</kbd> Next |
        <kbd>←</kbd> Prev |
        <kbd>Space</kbd> Next |
        <kbd>S</kbd> Speaker View |
        <kbd>Esc</kbd> Overview
    </div>

    <script src="https://cdn.jsdelivr.net/npm/reveal.js@4.5.0/dist/reveal.js"></script>

    <!-- Holdem Engine -->
    <script src="src/react-framer/dist/holdem-engine.iife.js"></script>

    <script>
        // 엔진 인스턴스
        let currentEngine = null;
        let currentEngineType = null; // 'deck' | 'holdem' | null

        // JSON 카드 번들 프리로드 (React 엔진용)
        async function loadCardBundle() {
            const response = await fetch('assets/cards-bundle.json');
            const data = await response.json();
            // 전역 변수에 저장 (React useCardBundle 훅에서 사용)
            window.CARDS_BUNDLE = data;
            console.log(`카드 번들 로드 완료: ${Object.keys(data).length}장`);
            return data;
        }

        // 슬라이드 파일 동적 로딩
        async function loadSlides() {
            const slidesContainer = document.querySelector('.reveal .slides');
            let allSlides = '';

            // Part 1: Hook
            const part1Response = await fetch('slides/part1-hook.html');
            allSlides += await part1Response.text();

            // Part 2.1: 카드와 족보
            const part2BasicsResponse = await fetch('slides/part2-basics.html');
            allSlides += await part2BasicsResponse.text();

            // Part 2.2: 게임 흐름 시나리오
            const part2GameplayResponse = await fetch('slides/part2-gameplay.html');
            allSlides += await part2GameplayResponse.text();

            slidesContainer.innerHTML = allSlides;

            // Reveal.js 초기화
            Reveal.initialize({
                hash: true,
                transition: 'slide',
                showNotes: false,
                keyboard: false,
                plugins: []
            });

            // 슬라이드 변경 감지
            Reveal.on('slidechanged', (event) => {
                const currentSlide = event.currentSlide;

                // 이전 엔진 정리
                if (currentEngine) {
                    currentEngine.destroy();
                    currentEngine = null;
                    currentEngineType = null;
                }

                // DeckEngine 슬라이드 (2.1.1)
                const deckContainer = currentSlide.querySelector('#deck-container');
                if (deckContainer) {
                    currentEngine = HoldemEngine.DeckEngine.mount(deckContainer);
                    currentEngineType = 'deck';
                    return;
                }

                // HoldemEngine 슬라이드 (2.2)
                const holdemContainer = currentSlide.querySelector('#holdem-container');
                if (holdemContainer) {
                    currentEngine = HoldemEngine.HoldemEngine.mount(holdemContainer, {
                        scenario: 'tutorial'
                    });
                    currentEngineType = 'holdem';
                    return;
                }

                // HandRankingEngine 슬라이드 (2.1.2)
                const handRankingContainer = currentSlide.querySelector('#hand-ranking-container');
                if (handRankingContainer) {
                    currentEngine = HoldemEngine.HandRankingEngine.mount(handRankingContainer);
                    currentEngineType = 'handRanking';
                    return;
                }
            });

            // 커스텀 키보드 제어
            document.addEventListener('keydown', (e) => {
                const hasEngine = currentEngine !== null;

                // Space: 엔진 step 진행 또는 다음 슬라이드
                if (e.code === 'Space') {
                    e.preventDefault();
                    if (hasEngine) {
                        const state = currentEngine.getState();
                        if (state.step < state.totalSteps - 1) {
                            currentEngine.nextStep();
                        } else {
                            Reveal.next();
                        }
                    } else {
                        Reveal.next();
                    }
                }
                // ArrowRight: 다음 슬라이드
                else if (e.code === 'ArrowRight') {
                    Reveal.next();
                }
                // ArrowLeft: 이전 step 또는 이전 슬라이드
                else if (e.code === 'ArrowLeft') {
                    if (hasEngine) {
                        const state = currentEngine.getState();
                        if (state.step > 0) {
                            currentEngine.prevStep();
                            return;
                        }
                    }
                    Reveal.prev();
                }
                // R: 리셋
                else if (e.code === 'KeyR' && hasEngine) {
                    currentEngine.reset();
                }
                // Esc: Overview
                else if (e.code === 'Escape') {
                    Reveal.toggleOverview();
                }
            });
        }

        // 카드 번들 로딩 후 슬라이드 로딩
        loadCardBundle().then(() => loadSlides());
    </script>
</body>
</html>
