<svg width="80" height="80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="btn-bg" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8935d;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="40" cy="40" r="38" fill="url(#btn-bg)" stroke="#fff" stroke-width="3"/>

  <!-- Inner ring -->
  <circle cx="40" cy="40" r="32" fill="none" stroke="#fff" stroke-width="2" opacity="0.4"/>

  <!-- Dealer button marker -->
  <circle cx="40" cy="26" r="5" fill="#fff"/>
  <text x="40" y="30" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">D</text>

  <!-- BTN text -->
  <text x="40" y="54" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">BTN</text>
</svg>
