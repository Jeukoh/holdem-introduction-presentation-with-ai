<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="buttonGrad" cx="50%" cy="40%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dee2e6;stop-opacity:1" />
    </radialGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.4"/>
    </filter>

    <style>
      .button-text { font-family: 'Arial Black', sans-serif; font-size: 80px; font-weight: 900; fill: #000000; }
      .button-label { font-family: 'Arial', sans-serif; font-size: 14px; font-weight: 600; fill: #495057; }
    </style>
  </defs>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="90" fill="url(#buttonGrad)" filter="url(#shadow)"/>

  <!-- Inner ring -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#000000" stroke-width="3"/>
  <circle cx="100" cy="100" r="75" fill="none" stroke="#000000" stroke-width="1"/>

  <!-- D Letter -->
  <text x="100" y="125" class="button-text" text-anchor="middle">D</text>

  <!-- Label -->
  <text x="100" y="165" class="button-label" text-anchor="middle">DEALER</text>
</svg>