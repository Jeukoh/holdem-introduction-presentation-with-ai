<svg width="120" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Seat circle -->
  <circle cx="60" cy="60" r="50" fill="#34495e" opacity="0.3" stroke="#7f8c8d" stroke-width="2" filter="url(#shadow)"/>

  <!-- Player icon -->
  <g transform="translate(60, 50)">
    <!-- Head -->
    <circle cx="0" cy="-5" r="12" fill="#95a5a6"/>
    <!-- Body -->
    <ellipse cx="0" cy="15" rx="18" ry="20" fill="#95a5a6"/>
  </g>

  <!-- Position label placeholder -->
  <rect x="40" y="95" width="40" height="20" rx="10" fill="#3498db" opacity="0.8"/>
  <text x="60" y="109" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">P1</text>
</svg>