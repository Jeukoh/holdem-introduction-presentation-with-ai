<svg width="100" height="60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background box -->
  <rect width="100" height="60" rx="10" fill="#34495e" opacity="0.8" filter="url(#shadow)"/>

  <!-- Ratio text -->
  <text x="50" y="40" font-family="Arial" font-size="28" font-weight="bold" fill="#f39c12" text-anchor="middle">3:1</text>
</svg>