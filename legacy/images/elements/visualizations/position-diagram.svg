<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Center table -->
  <ellipse cx="200" cy="200" rx="80" ry="60" fill="#2c5f2d" opacity="0.3" filter="url(#shadow)"/>

  <!-- Position seats (9 positions around the table) -->

  <!-- BTN (Button) - Bottom -->
  <circle cx="200" cy="320" r="35" fill="#e74c3c" filter="url(#shadow)"/>
  <text x="200" y="328" font-family="Arial" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">BTN</text>

  <!-- SB (Small Blind) - Bottom Left -->
  <circle cx="100" cy="300" r="35" fill="#3498db" filter="url(#shadow)"/>
  <text x="100" y="308" font-family="Arial" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">SB</text>

  <!-- BB (Big Blind) - Left -->
  <circle cx="50" cy="220" r="35" fill="#3498db" filter="url(#shadow)"/>
  <text x="50" y="228" font-family="Arial" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">BB</text>

  <!-- UTG (Under The Gun) - Top Left -->
  <circle cx="70" cy="130" r="35" fill="#95a5a6" filter="url(#shadow)"/>
  <text x="70" y="138" font-family="Arial" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">UTG</text>

  <!-- MP (Middle Position) - Top -->
  <circle cx="150" cy="80" r="35" fill="#95a5a6" filter="url(#shadow)"/>
  <text x="150" y="88" font-family="Arial" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">MP</text>

  <!-- HJ (Hijack) - Top Right of center -->
  <circle cx="250" cy="80" r="35" fill="#f39c12" filter="url(#shadow)"/>
  <text x="250" y="88" font-family="Arial" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">HJ</text>

  <!-- CO (Cutoff) - Right Top -->
  <circle cx="330" cy="130" r="35" fill="#f39c12" filter="url(#shadow)"/>
  <text x="330" y="138" font-family="Arial" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">CO</text>

  <!-- Dealer button indicator (small D on BTN) -->
  <circle cx="230" cy="310" r="12" fill="#ffffff" filter="url(#shadow)"/>
  <text x="230" y="316" font-family="Arial" font-size="12" font-weight="bold" fill="#e74c3c" text-anchor="middle">D</text>

  <!-- Legend -->
  <rect x="10" y="10" width="150" height="90" rx="5" fill="#ffffff" opacity="0.9" filter="url(#shadow)"/>
  <text x="20" y="30" font-family="Arial" font-size="14" font-weight="600" fill="#2c3e50">Position Value:</text>

  <circle cx="30" cy="48" r="8" fill="#95a5a6"/>
  <text x="45" y="53" font-family="Arial" font-size="12" fill="#2c3e50">Early (worst)</text>

  <circle cx="30" cy="68" r="8" fill="#f39c12"/>
  <text x="45" y="73" font-family="Arial" font-size="12" fill="#2c3e50">Late (good)</text>

  <circle cx="30" cy="88" r="8" fill="#e74c3c"/>
  <text x="45" y="93" font-family="Arial" font-size="12" fill="#2c3e50">BTN (best)</text>
</svg>
