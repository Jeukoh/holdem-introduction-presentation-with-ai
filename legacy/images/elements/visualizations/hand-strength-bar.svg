<svg width="400" height="80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="strengthGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2ecc71;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Label -->
  <text x="10" y="25" font-family="Arial" font-size="16" font-weight="600" fill="#2c3e50">Hand Strength</text>

  <!-- Background bar -->
  <rect x="10" y="35" width="380" height="35" rx="17.5" fill="#ecf0f1" filter="url(#shadow)"/>

  <!-- Gradient fill bar (70% example) -->
  <rect x="10" y="35" width="266" height="35" rx="17.5" fill="url(#strengthGradient)"/>

  <!-- Percentage text -->
  <text x="200" y="58" font-family="Arial" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">70%</text>

  <!-- Min/Max labels -->
  <text x="10" y="78" font-family="Arial" font-size="12" fill="#7f8c8d">Weak</text>
  <text x="390" y="78" font-family="Arial" font-size="12" fill="#7f8c8d" text-anchor="end">Strong</text>
</svg>
